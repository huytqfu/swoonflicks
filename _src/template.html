<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swoonflicks · Full episodes</title>
<meta name="description" content="Watch the full episodes of the short dramas from Swoonflicks.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#09080c;--card:#16131b;--line:#2a2430;--rose-hi:#ff5c84;--rose:#ea2658;--crim:#a80e38;--white:#f6f4f7;--muted:#a59fac}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--white);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px}
header{text-align:center;margin-bottom:24px}
header img{width:84px;height:84px;border-radius:50%;background:var(--card);border:2px solid var(--rose)}
header h1{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-top:10px}
header p{color:var(--muted);font-size:14px;margin-top:4px}
.card{display:flex;gap:14px;padding:12px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;
  color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--rose)}
.card img{width:108px;height:144px;flex:none;object-fit:cover;border-radius:12px;background:#000}
.meta{display:flex;flex-direction:column;min-width:0}
.meta h2{font-size:17px;font-weight:700;line-height:1.25}
.meta p{color:var(--muted);font-size:13px;line-height:1.4;margin:6px 0 10px;flex:1}
.btn{align-self:flex-start;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;
  background:linear-gradient(100deg,var(--rose-hi),var(--rose) 55%,var(--crim));box-shadow:0 6px 18px rgba(234,38,88,.35)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<header>
  <img src="img/logo.png" alt="Swoonflicks">
  <h1>Swoonflicks</h1>
  <p>Hooked on a clip? Tap the drama to watch every episode.</p>
</header>
<main>
{{CARDS}}
</main>
<footer>New dramas every week. Links open the official app.<br>Swoonflicks may earn a commission when you watch.</footer>
</div>
</body>
</html>
